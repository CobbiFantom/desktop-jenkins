name: Налаштувати Python і Qt
description: Спільне середовище тестів і збирання для трьох ОС
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements-lock.txt
    - name: Бібліотеки Qt та Xvfb для Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils libegl1 libgl1 libopengl0 libdbus-1-3 libxkbcommon0 \
          libfontconfig1 libglib2.0-0t64 fonts-dejavu-core \
          libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
          libxcb-shape0 libxcb-xinerama0 libxcb-randr0 xvfb xauth
    - name: Залежності Python
      shell: bash
      run: python -m pip install -r requirements-lock.txt
