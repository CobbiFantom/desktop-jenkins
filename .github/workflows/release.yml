name: Desktop release

on:
  push:
    tags: ['v*']
  # Ручний запуск перевіряє всі збірки та зберігає ZIP у Actions Artifacts.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Збірка — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Тести
        run: python -m pytest --junitxml=reports/tests.xml
      - name: Зберегти звіт тестів
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tests-${{ matrix.platform }}
          path: reports/tests.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Зібрати застосунок
        run: python -m PyInstaller --noconfirm --clean PDFUkrainian.spec
      - name: Перевірити запуск і створити ZIP
        run: python scripts/package.py --smoke-test
      - name: Зберегти пакет
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/PDFUkrainian-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Опублікувати реліз
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: packages
      - name: Створити реліз і додати три ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/github_release.py publish "$RELEASE_TAG" "$RELEASE_COMMIT" packages
